name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TallyDataViewer.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: TallyDataViewer-apk
          path: TallyDataViewer.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Tally Data Viewer (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: TallyDataViewer.apk
          body: |
            Download **TallyDataViewer.apk** below and install it on your Android phone.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
